name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 12 * * *' # Se ejecuta cada 3 días a las 12:00 UTC
  workflow_dispatch: # Añade un botón en GitHub para ejecutarlo manualmente y probarlo

jobs:
  ping-rest:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta vía API REST
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/characters?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

  ping-postgres:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta directa a Postgres
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$DB_URL" -c "select count(*) from public.characters;"

#0   12   */3   *   *
#│    │     │    │   └─ día de la semana (0-6, domingo=0)
#│    │     │    └───── mes (1-12)
#│    │     └────────── día del mes (1-31)
#│    └──────────────── hora (0-23, en UTC)
#└───────────────────── minuto (0-59)